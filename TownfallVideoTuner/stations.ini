; Townfall Video Tuner settings. This file is optional: without it, these defaults apply.
; Restart the game after changing it. Frequencies are dial positions from 0.0 to 1.0.
[General]
; Give every video in Videos a station (false: only the stations below).
autoAssign=true
; Where the stations go: auto (a free end of the dial, the right one first), left, right, both or full.
frequencySide=auto
; How close to a station the dial must be, and an extra margin so it doesn't drop out at its edge.
tolerance=0.010
hysteresis=0.005
; The sound's fade when you tune away, in ms (0 to 2000).
fadeMs=200
; The picture's size on the CRTV's screen (160 to 2048 wide, 120 to 2048 high).
outputWidth=640
outputHeight=480
; How long a video stays ready after you tune away, in ms (0 to 10000; 0 releases it at once).
warmDecoderMs=3000

; A station of your own at a fixed frequency (remove the ; to use it). loop: start again at the end;
; volume: 0 to 2.
; [MyStation]
; file=my-video.mkv
; frequency=0.350
; loop=true
; volume=1.0
